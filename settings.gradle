// Enable the Gradle plugin portal to download plugins
// This is the MOST IMPORTANT part - Google's Maven repo must be included
pluginManagement {
    repositories {
        google()  // 🎯 CRUCIAL: Google's Maven repo for Android plugins
        mavenCentral()  // For other plugins
        gradlePluginPortal()
    }
}

// Enable the Gradle Central Plugin Repository
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()  // 🎯 CRUCIAL: Google's Maven repo for Android libraries
        mavenCentral()
    }
}

rootProject.name = 'LoyaltyCards'
include ':app'
